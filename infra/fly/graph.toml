app = "blastspec-graph"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  KUZU_PATH = "/data/kuzu"
  PORT = "8001"

[[mounts]]
  source = "kuzu_data"
  destination = "/data"

[http_service]
  internal_port = 8001
  force_https = false
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"